multi_range:
  - discovery_name: MultiRange Discovery
    discovery_type: "MULTI RANGE"
    ip_address_list:
      - 204.1.2.1-204.1.2.5
      - 204.192.3.40
      - 204.192.4.200
      - 204.1.2.6
      - 204.1.2.7
      - 204.1.2.8
      - 204.1.2.9
    ip_filter_list:
      - 204.1.2.3
    protocol_order: ssh
    discovery_specific_credentials:
      cli_credentials_list:
        - username: cisco
          password: "{{ lab_device_cli_password }}"
          enable_password: "{{ lab_device_cli_enable_password }}"
      snmp_v3_credential:
        username: v3Public2
        snmp_mode: AUTHPRIV
        auth_type: SHA
        auth_password: "{{ lab_device_snmp_v3_auth_password }}"
        privacy_type: AES256
        privacy_password: "{{ lab_device_snmp_v3_privacy_password }}"
    retry: 1
    timeout: 1


