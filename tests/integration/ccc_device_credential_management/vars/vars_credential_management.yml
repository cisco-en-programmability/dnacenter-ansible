---
credentials_details: #Create multiple credentials for the same protocol
 - global_credential_details:
    cli_credential:
    - description: CLI1
      username: cli-1
      password: "{{ device_credential_cli_1_password }}"
      enable_password: "{{ device_credential_cli_1_enable_password }}"
    - description: CLI2
      username: cli-2
      password: "{{ device_credential_cli_2_password }}"
      enable_password: "{{ device_credential_cli_2_enable_password }}"
    - description: CLI3
      username: cli-3
      password: "{{ device_credential_cli_3_password }}"
      enable_password: "{{ device_credential_cli_3_enable_password }}"
    snmp_v2c_read:
    - description: SNMPv2cRead Test 1
      read_community: "{{ device_credential_snmp_v2c_read_1_community }}"
    - description: SNMPv2cRead Test 2
      read_community: "{{ device_credential_snmp_v2c_read_2_community }}"
    - description: SNMPv2cRead Test 3
      read_community: "{{ device_credential_snmp_v2c_read_3_community }}"
    snmp_v2c_write:
    - description: SNMPv2cWrite Test 1
      write_community: "{{ device_credential_snmp_v2c_write_1_community }}"
    - description: SNMPv2cWrite Test 2
      write_community: "{{ device_credential_snmp_v2c_write_2_community }}"
    - description: SNMPv2cWrite Test 3
      write_community: "{{ device_credential_snmp_v2c_write_3_community }}"
    snmp_v3:
    - description: SNMPv3 Test 1 
      auth_password: "{{ device_credential_snmp_v3_1_auth_password }}"
      auth_type: SHA
      snmp_mode: AUTHPRIV
      privacy_password: "{{ device_credential_snmp_v3_1_privacy_password }}"
      privacy_type: AES128
      username: admin
    - description: SNMPv3 Test 2
      auth_password: "{{ device_credential_snmp_v3_2_auth_password }}"
      auth_type: SHA
      snmp_mode: AUTHPRIV
      privacy_password: "{{ device_credential_snmp_v3_2_privacy_password }}"
      privacy_type: AES128
      username: admin
    - description: SNMPv3 Test 3
      auth_password: "{{ device_credential_snmp_v3_3_auth_password }}"
      auth_type: SHA
      snmp_mode: AUTHPRIV
      privacy_password: "{{ device_credential_snmp_v3_3_privacy_password }}"
      privacy_type: AES128
      username: admin
    https_read:
    - description: httpsRead Test 1
      username: admin
      password: "{{ device_credential_https_read_1_password }}"
      port: 443
    - description: httpsRead Test 2
      username: admin
      password: "{{ device_credential_https_read_2_password }}"
      port: 443
    - description: httpsRead Test 3
      username: admin
      password: "{{ device_credential_https_read_3_password }}"
      port: 443
    https_write:
    - description: httpsWrite Test 1
      username: admin
      password: "{{ device_credential_https_write_1_password }}"
      port: 443

credentials_update:
 - global_credential_details:
    cli_credential:
    - description: CLI1
      username: cli-1
      password: "{{ device_credential_cli_1_updated_password }}"
      enable_password: "{{ device_credential_cli_1_updated_enable_password }}"
    snmp_v2c_read:
    - description: SNMPv2cRead Test 1
      read_community: "{{ device_credential_snmp_v2c_read_1_updated_community }}"
    snmpV2cWrite:
    - description: SNMPv2cWrite Test 1
      write_community: "{{ device_credential_snmp_v2c_write_1_updated_community }}"
    snmpV3:
    - description: SNMPv3 Test 1
      auth_password: "{{ device_credential_snmp_v3_1_updated_auth_password }}"
      auth_type: SHA
      snmp_mode: AUTHNOPRIV
      privacy_password: "{{ device_credential_snmp_v3_1_updated_privacy_password }}"
      privacy_type: AES192
      username: admin
    https_read:
    - description: httpsRead Test 1
      username: admin
      password: "{{ device_credential_https_read_1_updated_password }}"
      port: 443
    https_write:
    - description: httpsWrite Test 1
      username: admin
      password: "{{ device_credential_https_write_1_updated_password }}"
      port: 443
