---
design_sites:
  - site:
      area:
        name: TEST_SITE_DEVICE_CREDENTIALS
        parent_name: 'Global'
    site_type: area


credentials_details:
 - global_credential_details:
    cli_credential:
    - description: CLIAssign
      username: cli-A
      password: "{{ device_credential_cli_1_password }}"
      enable_password: "{{ device_credential_cli_1_enable_password }}"
    snmp_v2c_read:
    - description: SNMPv2cRead Test Assign
      read_community: "{{ lab_device_snmp_v2_read_community }}"
    snmp_v2c_write:
    - description: SNMPv2cWrite Test Assign
      write_community: "{{ lab_device_snmp_v2_write_community }}"
    snmp_v3:
    - description: SNMPv3 Test Assign
      auth_password: "{{ device_credential_snmp_v3_1_auth_password }}"
      auth_type: SHA
      snmp_mode: AUTHPRIV
      privacy_password: "{{ device_credential_snmp_v3_1_privacy_password }}"
      privacy_type: AES128
      username: admin
    https_read:
    - description: httpsRead Test Assign
      username: admin
      password: "{{ device_credential_assign_https_read_password }}"
      port: 443
    https_write:
    - description: httpsWrite Test Assign
      username: admin
      password: "{{ device_credential_assign_https_write_password }}"
      port: 443


credentials_assign:
 - assign_credentials_to_site: # Assign device credentials to sites
    cli_credential:
      description: CLIAssign
      username:  cli-A
    snmp_v2c_read:  
      description: SNMPv2cRead Test Assign
    snmp_v2c_write:
      description: SNMPv2cWrite Test Assign
    snmp_v3:
      description: SNMPv3 Test Assign
    https_read:
      username: admin
      description: httpsRead Test Assign
    https_write:
      username: admin
      description: httpsWrite Test Assign
    site_name:
    - "Global/TEST_SITE_DEVICE_CREDENTIALS"

credentials_apply:
 - apply_credentials_to_site: # Apply device credentials to sites
    cli_credential:
      description: CLIAssign
      username:  cli-A
    snmp_v2c_read:  
      description: SNMPv2cRead Test Assign
    snmp_v2c_write:
      description: SNMPv2cWrite Test Assign
    snmp_v3:
      description: SNMPv3 Test Assign
    site_name:
    - "Global/TEST_SITE_DEVICE_CREDENTIALS"


